<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storyboard & Voice Over</title>
<meta name="theme-color" content="#4B3FD6">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF1F5;--panel:#FFFFFF;--ink:#1B2433;--mute:#5B6678;--line:#CBD3DE;--acc:#4B3FD6;--onacc:#FFFFFF;--hl:#F2B632;--frame:#1B2433;--onframe:#F2B632;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A26;--panel:#1D2535;--ink:#E8ECF3;--mute:#9AA6BA;--line:#2F3A50;--acc:#8E86FF;--onacc:#10131C;--frame:#0C101A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A26;--panel:#1D2535;--ink:#E8ECF3;--mute:#9AA6BA;--line:#2F3A50;--acc:#8E86FF;--onacc:#10131C;--frame:#0C101A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.65rem;line-height:1.2;margin:4px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
label:first-child{margin-top:0}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:150px;resize:vertical}
textarea:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink);font-size:.95rem}
.chk input{width:auto}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--onacc);cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.go{width:100%;margin-top:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 12px;align-items:center}
.bar .info{flex:1 1 100%;font-weight:600}
.bar button{flex:1 1 auto}
.scene{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-bottom:12px}
.fr{background:var(--frame);color:var(--onframe);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--hl)}
.fr.p{width:54px;aspect-ratio:9/16}
.fr.l{width:96px;aspect-ratio:16/9}
.fr small{font-weight:500;font-size:.72rem;opacity:.85}
.scene label{margin-top:8px}
.scene textarea{min-height:64px}
.t{font-size:.8rem;color:var(--mute);margin:0}
.vo{margin-bottom:12px}.vo .bar{margin:12px 0 0}.vo .bar button{flex:1 1 0}input[type=range]{padding:0;border:0;background:none}.mini{padding:4px 12px;font-size:.8rem;margin-left:6px}.scene.now{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
<h1>Storyboard & voice over</h1>
<p class="sub">Tempel naskah, dapatkan pembagian scene, durasi, prompt visual, dan teks voice over siap tempel ke ElevenLabs.</p>

<section class="box">
<label for="judul">Judul video</label>
<input id="judul" placeholder="Contoh: B.J. Habibie">
<label for="naskah">Naskah narasi</label>
<textarea id="naskah" placeholder="Tempel seluruh naskah di sini. Kalimat akan dibagi otomatis ke beberapa scene."></textarea>
<div class="row">
<div><label for="fmt">Format</label>
<select id="fmt"><option value="p">9:16 Reels / Shorts</option><option value="l">16:9 YouTube panjang</option></select></div>
<div><label for="jml">Jumlah scene</label>
<input id="jml" type="number" min="1" max="40" inputmode="numeric" placeholder="Otomatis"></div>
</div>
<label for="gaya">Gaya visual</label>
<select id="gaya">
<option value="flat">2D flat vector edukasi (pastel)</option>
<option value="clay">3D clay hangat</option>
<option value="lova">Ruang gelap sinematik (misteri)</option>
</select>
<label class="chk"><input id="angka" type="checkbox" checked> Tulis angka dengan huruf</label>
<button class="go" id="gen">Buat storyboard</button>
</section>

<div id="out" hidden>
<div class="bar">
<div class="info" id="info"></div>
<button id="cvo">Salin voice over</button>
<button class="ghost" id="cst">Salin storyboard</button>
</div>
<section class="box vo"><label for="vsel">Suara</label><select id="vsel"></select><div class="row"><div><label for="vrate">Kecepatan</label><input id="vrate" type="range" min="0.6" max="1.4" step="0.05" value="1"></div><div><label for="vpitch">Nada</label><input id="vpitch" type="range" min="0.6" max="1.4" step="0.05" value="1"></div></div><div class="bar"><button id="vall">Putar semua</button><button class="ghost" id="vstop">Berhenti</button></div><p class="t" id="vnote"></p></section>
<div id="list"></div>
</div>
</main>
<div id="toast" role="status"></div>

<script>
var $=function(i){return document.getElementById(i)};
var STY={
flat:{p:"Modern 2D flat vector educational cartoon, cute expressive characters, bright pastel colors, bold clean outlines, minimal shading",bg:"Latar sederhana berwarna pastel dengan elemen pendukung minimal",neg:"3D render, realistic photo, text, watermark, blurry, extra fingers, distorted hands"},
clay:{p:"Warm 3D clay animation style, soft studio lighting, rounded shapes, tactile handmade texture",bg:"Diorama kecil bertekstur tanah liat dengan cahaya hangat lembut",neg:"flat vector, realistic photo, text, watermark, blurry, harsh shadows, distorted hands"},
lova:{p:"Cinematic dark brown and black room, warm desk lamp lighting part of the scene, classic decor, light atmospheric fog, moody mystery tone",bg:"Ruangan gelap cokelat tua dan hitam, lampu meja hangat, rak buku klasik, sedikit kabut",neg:"bright colors, cartoon, text, watermark, blurry, crowded background, distorted hands"}
};
var CAM=["Wide shot, slow push-in","Medium shot, static","Close-up, slow zoom","Medium shot, pan pelan kiri ke kanan","Low angle, tilt up pelan","Top-down, putar sangat pelan"];
var scenes=[];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function words(s){return (s.trim().match(/\S+/g)||[]).length}
function mmss(n){var m=Math.floor(n/60),s=n%60;return m+":"+(s<10?"0":"")+s}

var U=["nol","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan"];
function num(n){
if(n<10)return U[n];
if(n===10)return "sepuluh";
if(n===11)return "sebelas";
if(n<20)return U[n-10]+" belas";
if(n<100)return U[Math.floor(n/10)]+" puluh"+(n%10?" "+U[n%10]:"");
if(n<200)return "seratus"+(n%100?" "+num(n%100):"");
if(n<1000)return U[Math.floor(n/100)]+" ratus"+(n%100?" "+num(n%100):"");
if(n<2000)return "seribu"+(n%1000?" "+num(n%1000):"");
if(n<1e6)return num(Math.floor(n/1000))+" ribu"+(n%1000?" "+num(n%1000):"");
if(n<1e9)return num(Math.floor(n/1e6))+" juta"+(n%1e6?" "+num(n%1e6):"");
if(n<1e12)return num(Math.floor(n/1e9))+" miliar"+(n%1e9?" "+num(n%1e9):"");
return String(n);
}
function toWords(t){
return t.replace(/%/g," persen").replace(/\d+(?:\.\d{3})*/g,function(m){return num(parseInt(m.replace(/\./g,""),10))});
}

function emo(s,i,n){
var x=s.toLowerCase();
if(i===0)return "mysterious";
if(/takut|seram|gelap|hantu|teror|mengerikan/.test(x))return "fearful";
if(/sedih|hilang|menangis|kehilangan|sendiri/.test(x))return "sad";
if(/marah|benci|murka/.test(x))return "angry";
if(/\?/.test(s))return "curious";
if(/!/.test(s))return "excited";
if(i===n-1)return "inspiring";
if(/berhasil|menang|akhirnya|bangga|juara/.test(x))return "proud";
return "calm";
}

function build(){
var raw=$("naskah").value.trim();
if(!raw){toast("Tempel naskah dulu.");return}
var t=$("angka").checked?toWords(raw):raw;
var S=t.replace(/\s+/g," ").match(/[^.!?]+[.!?]*/g).map(function(x){return x.trim()}).filter(Boolean);
var total=words(t),fmt=$("fmt").value;
var seg=fmt==="p"?8:40;
var N=parseInt($("jml").value,10);
if(!N||N<1)N=Math.round(total/2.5/seg);
N=Math.max(1,Math.min(N,S.length,40));
var target=total/N,G=[[]],acc=0;
S.forEach(function(s,i){
G[G.length-1].push(s);acc+=words(s);
if(acc>=target*G.length&&G.length<N&&i<S.length-1)G.push([]);
});
var st=STY[$("gaya").value];
scenes=G.map(function(g,i){
var txt=g.join(" "),n=G.length;
var cam=i===0?"Close-up, slow zoom in (hook pembuka)":i===n-1?"Pull back ke wide shot (penutup)":CAM[i%CAM.length];
var gist=txt.split(" ").slice(0,14).join(" ");
return{
visual:"Visualkan isi narasi: \u201c"+gist+(txt.split(" ").length>14?"\u2026":"")+"\u201d. Satu fokus utama yang jelas.",
action:"Karakter atau objek utama bereaksi sesuai narasi dengan gerakan halus dan mudah dibaca.",
cam:cam,bg:st.bg,tag:emo(txt,i,n),text:txt,sec:Math.max(2,Math.round(words(txt)/2.5))
};
});
render();
try{localStorage.setItem("sb_draft",JSON.stringify({j:$("judul").value,n:raw}))}catch(e){}
}

function render(){
var fmt=$("fmt").value,tot=0;
scenes.forEach(function(s){tot+=s.sec});
$("info").textContent=scenes.length+" scene \u2022 perkiraan "+mmss(tot);
var h="",c=0;
scenes.forEach(function(s,i){
var a=c;c+=s.sec;
h+='<article class="box scene"><div class="fr '+fmt+'">'+(i+1)+'<small>'+s.sec+' dtk</small></div><div>'
+'<p class="t">'+mmss(a)+' \u2013 '+mmss(c)+'<button class="ghost mini" data-play="'+i+'">Putar</button></p>'
+f(i,"visual","Visual","textarea",s.visual)+f(i,"action","Aksi","textarea",s.action)
+f(i,"cam","Kamera","input",s.cam)+f(i,"bg","Latar","input",s.bg)
+f(i,"tag","Ekspresi suara","input",s.tag)+f(i,"text","Narasi","textarea",s.text)
+'</div></article>';
});
$("list").innerHTML=h;$("out").hidden=false;
$("out").scrollIntoView({behavior:"smooth",block:"start"});
}
function f(i,k,l,type,v){
var id="f"+i+k;
return '<label for="'+id+'">'+l+'</label>'+(type==="textarea"?'<textarea id="'+id+'" data-i="'+i+'" data-k="'+k+'">'+esc(v)+'</textarea>':'<input id="'+id+'" data-i="'+i+'" data-k="'+k+'" value="'+esc(v)+'">');
}
$("list").addEventListener("input",function(e){
var d=e.target.dataset;if(d.i===undefined)return;
scenes[d.i][d.k]=e.target.value;
if(d.k==="text"){scenes[d.i].sec=Math.max(2,Math.round(words(e.target.value)/2.5))}
});
$("list").addEventListener("change",function(e){if(e.target.dataset.k==="text")render()});

function voText(){return scenes.map(function(s){return "["+s.tag.replace(/^\[|\]$/g,"")+"] "+s.text}).join("\n\n")}
function sbText(){
var st=STY[$("gaya").value],fmt=$("fmt").value==="p"?"Vertikal 9:16":"Horizontal 16:9",c=0,tot=0;
scenes.forEach(function(s){tot+=s.sec});
var o=($("judul").value||"Tanpa judul")+"\n"+fmt+" \u2022 "+mmss(tot)+" \u2022 "+scenes.length+" scene\nGaya: "+st.p+"\n";
scenes.forEach(function(s,i){
var a=c;c+=s.sec;
o+="\nSCENE "+(i+1)+" ("+mmss(a)+"\u2013"+mmss(c)+")\nVISUAL: "+s.visual+"\nACTION: "+s.action+"\nCAMERA: "+s.cam+"\nBACKGROUND: "+s.bg+"\nNARASI: ["+s.tag.replace(/^\[|\]$/g,"")+"] "+s.text+"\n";
});
return o+"\nNEGATIVE PROMPT: "+st.neg+"\n";
}

function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},1800)}
function copy(txt,msg){
function fb(){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(msg)}catch(e){toast("Gagal menyalin")}document.body.removeChild(a)}
try{navigator.clipboard.writeText(txt).then(function(){toast(msg)},fb)}catch(e){fb()}
}
var synth=window.speechSynthesis,voices=[],run=0;
var EM={mysterious:[0.9,0.85],fearful:[1.05,1.1],sad:[0.85,0.8],angry:[1.05,0.9],curious:[1,1.1],excited:[1.15,1.15],inspiring:[0.95,1],proud:[0.95,1],calm:[0.92,0.95]};
function loadVoices(){
if(!synth){$("vnote").textContent="Browser ini tidak mendukung suara bawaan.";return}
voices=synth.getVoices();
var ord=voices.map(function(v,i){return i}).sort(function(a,b){return (/^id/i.test(voices[b].lang)?1:0)-(/^id/i.test(voices[a].lang)?1:0)});
$("vsel").innerHTML=ord.map(function(i){return '<option value="'+i+'">'+esc(voices[i].name+' ('+voices[i].lang+')')+'</option>'}).join("");
var hasId=voices.some(function(v){return /^id/i.test(v.lang)});
$("vnote").textContent=hasId?"Memakai suara bawaan perangkat. Kualitasnya belum setara ElevenLabs dan belum bisa diunduh sebagai file audio. Ekspresi di tiap scene mengatur kecepatan dan nada.":"Belum ada suara bahasa Indonesia di perangkat ini. Pasang data suara Indonesia di pengaturan teks-ke-ucapan HP.";
}
function mark(i){var e=document.querySelectorAll(".scene");for(var k=0;k<e.length;k++)e[k].classList.toggle("now",k===i)}
function say(i,done){
var s=scenes[i],u=new SpeechSynthesisUtterance(s.text);
var m=EM[(s.tag||"").replace(/[\[\]\s]/g,"").split(",")[0].toLowerCase()]||[1,1];
var v=voices[parseInt($("vsel").value,10)];
if(v){u.voice=v;u.lang=v.lang}else u.lang="id-ID";
u.rate=Math.min(2,Math.max(0.5,parseFloat($("vrate").value)*m[0]));
u.pitch=Math.min(2,Math.max(0,parseFloat($("vpitch").value)*m[1]));
u.onend=done;u.onerror=done;mark(i);synth.speak(u);
}
function playFrom(i,all){
if(!synth){toast("Suara tidak didukung di browser ini");return}
if(!scenes.length){toast("Buat storyboard dulu.");return}
synth.cancel();var my=++run;
function next(k){
if(my!==run)return;
if(k>=scenes.length){mark(-1);return}
say(k,function(){if(my!==run)return;if(all)next(k+1);else mark(-1)});
}
setTimeout(function(){next(i)},80);
}
function stopV(){run++;if(synth)synth.cancel();mark(-1)}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else loadVoices();
$("vall").addEventListener("click",function(){playFrom(0,true)});
$("vstop").addEventListener("click",stopV);
$("list").addEventListener("click",function(e){var b=e.target.closest("[data-play]");if(b)playFrom(parseInt(b.dataset.play,10),false)});
$("gen").addEventListener("click",build);
$("cvo").addEventListener("click",function(){copy(voText(),"Voice over disalin")});
$("cst").addEventListener("click",function(){copy(sbText(),"Storyboard disalin")});
try{var d=JSON.parse(localStorage.getItem("sb_draft")||"null");if(d){$("judul").value=d.j||"";$("naskah").value=d.n||""}}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
